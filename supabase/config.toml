project_id = "saiful-iptv-player"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.migrations]
enabled = true
schema_paths = ["./migrations/*.sql"]

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://localhost:8000"
additional_redirect_urls = ["http://127.0.0.1:8000", "saiful-iptv://auth-callback"]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits_symbols"
enable_anonymous_sign_ins = false
enable_manual_linking = false

[auth.rate_limit]
email_sent = 3
sign_in_sign_ups = 20
token_refresh = 60
token_verifications = 20

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083

[functions.device-register]
verify_jwt = true

[functions.device-revoke]
verify_jwt = true

[functions.sync]
verify_jwt = true

[functions.bug-report]
verify_jwt = true

[functions.account-delete]
verify_jwt = true

[functions.admin-api]
verify_jwt = true
