<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Saiful IPTV · Admin</title>
  <style>
    :root{font-family:"Aptos", "Segoe UI", sans-serif;color:#17211e;background:#f3f6f4;font-synthesis:none;text-rendering:optimizeLegibility;--ink:#17211e;--muted:#65716b;--line:#dce4df;--paper:#fff;--green:#287b61;--red:#d94a3d;--amber:#e4a43a;--nav:#1d2924}
    *{box-sizing:border-box}body{margin:0;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}
    .login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(140deg,#e9efec 0%,#f7f8f6 55%,#f5e8dc 100%)}
    .login{width:min(440px,100%);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:28px;box-shadow:0 12px 36px #17211e12}
    h1,h2,h3,p{margin-top:0}h1{font-size:25px;margin-bottom:8px}h2{font-size:22px;margin-bottom:4px}h3{font-size:16px;margin-bottom:12px}.muted{color:var(--muted);font-size:14px;line-height:1.5}
    label{display:block;font-size:13px;font-weight:650;margin:14px 0 6px}input,select,textarea{width:100%;border:1px solid #bdc9c2;border-radius:6px;padding:10px 12px;background:#fff;color:var(--ink)}textarea{min-height:96px;resize:vertical}input:focus,select:focus,textarea:focus{outline:2px solid #287b6140;border-color:var(--green)}
    .primary,.secondary,.danger,.icon-button{border:0;border-radius:6px;padding:10px 14px;font-weight:650}.primary{background:var(--green);color:white}.secondary{background:#e9efec;color:var(--ink)}.danger{background:#fae9e7;color:#9e2f26}.login .primary{width:100%;margin-top:20px}.error{color:#a52e26;font-size:13px;min-height:18px;margin:12px 0 0}.notice{padding:10px 12px;border-radius:6px;background:#edf5f0;color:#15533f;font-size:13px;margin:12px 0}
    .app{min-height:100vh;display:grid;grid-template-columns:220px minmax(0,1fr)}.sidebar{background:var(--nav);color:#e8efeb;padding:22px 14px;display:flex;flex-direction:column;gap:6px}.brand{font-weight:750;font-size:16px;padding:6px 10px 20px;letter-spacing:.04em}.brand small{display:block;font-size:11px;color:#a8b8af;font-weight:500;letter-spacing:0;margin-top:5px}.nav-button{display:flex;align-items:center;gap:10px;text-align:left;background:transparent;color:#d0d9d4;border:0;border-radius:6px;padding:10px;font-size:14px}.nav-button:hover,.nav-button.active{background:#35463e;color:white}.sidebar-bottom{margin-top:auto}.main{min-width:0}.topbar{height:64px;border-bottom:1px solid var(--line);background:#ffffffcc;display:flex;align-items:center;justify-content:space-between;padding:0 26px;gap:16px}.topbar .muted{margin:0}.content{max-width:1180px;padding:28px 26px 52px;margin:0 auto}.heading{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px}.heading p{margin:6px 0 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.metric{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:18px;min-height:108px}.metric strong{display:block;font-size:27px;margin-top:10px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:18px;margin:14px 0}.toolbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.toolbar>label{flex:1;min-width:180px;margin:0}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--paper)}table{width:100%;border-collapse:collapse;min-width:680px}th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13px}th{font-size:11px;text-transform:uppercase;color:var(--muted);background:#f8faf8}tr:last-child td{border-bottom:0}.row-actions{display:flex;gap:6px;flex-wrap:wrap}.row-actions button{padding:7px 9px;font-size:12px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}.wide{grid-column:1/-1}.check{display:flex;align-items:center;gap:8px;margin:14px 0}.check input{width:auto}.chip{display:inline-block;background:#edf5f0;border-radius:4px;padding:3px 7px;font-size:11px;color:#15533f}.empty{padding:28px;text-align:center;color:var(--muted)}.hidden{display:none!important}
    @media(max-width:820px){.app{grid-template-columns:1fr}.sidebar{position:sticky;top:0;z-index:2;flex-direction:row;overflow-x:auto;padding:8px}.brand{display:none}.nav-button{white-space:nowrap}.sidebar-bottom{margin:0 0 0 auto}.grid{grid-template-columns:1fr 1fr}.topbar{padding:0 16px}.content{padding:22px 16px 40px}}
    @media(max-width:520px){.grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.wide{grid-column:auto}.heading{display:block}.heading .primary{margin-top:12px}}
  </style>
</head>
<body>
  <section class="login-wrap" id="login-view">
    <form class="login" id="login-form">
      <h1>Saiful IPTV · Admin</h1>
      <p class="muted">Sign in with an account assigned the server-side admin role.</p>
      <label for="project-url">Supabase project URL</label>
      <input id="project-url" type="url" placeholder="https://project.supabase.co" autocomplete="url" required>
      <label for="public-key">Supabase publishable key</label>
      <input id="public-key" type="password" autocomplete="off" required>
      <label for="email">Admin email</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button class="primary" id="login-submit" type="submit">Sign in</button>
      <p class="error" id="login-error" role="alert"></p>
    </form>
  </section>

  <div class="app hidden" id="app-view">
    <aside class="sidebar" aria-label="Admin sections">
      <div class="brand">SAIFUL <small>CONTROL ROOM</small></div>
      <button class="nav-button active" data-view="overview">◫ <span>Overview</span></button>
      <button class="nav-button" data-view="users">♙ <span>Users</span></button>
      <button class="nav-button" data-view="devices">▤ <span>Devices</span></button>
      <button class="nav-button" data-view="announcements">▣ <span>Announcements</span></button>
      <button class="nav-button" data-view="reports">⚑ <span>Bug reports</span></button>
      <button class="nav-button" data-view="features">◉ <span>Feature config</span></button>
      <button class="nav-button" data-view="version">⬆ <span>Version</span></button>
      <div class="sidebar-bottom"><button class="nav-button" id="sign-out">↪ <span>Sign out</span></button></div>
    </aside>
    <main class="main">
      <header class="topbar"><strong id="view-label">Overview</strong><p class="muted" id="admin-email"></p></header>
      <section class="content" id="content" aria-live="polite"></section>
    </main>
  </div>
  <script type="module">
    const $ = (selector) => document.querySelector(selector);
    const loginView = $('#login-view');
    const appView = $('#app-view');
    const content = $('#content');
    const state = { url: '', key: '', token: '', email: '', view: 'overview' };
    const el = (tag, text, className) => {
      const node = document.createElement(tag);
      if (text !== undefined) node.textContent = text;
      if (className) node.className = className;
      return node;
    };
    const safeText = (value) => typeof value === 'string' ? value : '';

    async function api(action, values = {}) {
      const response = await fetch(`${state.url}/functions/v1/admin-api`, {
        method: 'POST',
        headers: {
          apikey: state.key,
          authorization: `Bearer ${state.token}`,
          'content-type': 'application/json',
        },
        body: JSON.stringify({ action, ...values }),
      });
      const body = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(body.error || 'Request failed');
      return body.data ?? body;
    }

    function setError(node, message) { node.textContent = message || ''; }
    function page(title, subtitle) {
      content.replaceChildren();
      const head = el('div', undefined, 'heading');
      const copy = document.createElement('div');
      copy.append(el('h2', title), el('p', subtitle, 'muted'));
      head.append(copy);
      content.append(head);
      $('#view-label').textContent = title;
      return head;
    }
    function table(headers, rows) {
      const wrap = el('div', undefined, 'table-wrap');
      const tableNode = document.createElement('table');
      const thead = document.createElement('thead');
      const headerRow = document.createElement('tr');
      headers.forEach((value) => headerRow.append(el('th', value)));
      thead.append(headerRow);
      const tbody = document.createElement('tbody');
      rows.forEach((row) => tbody.append(row));
      tableNode.append(thead, tbody);
      wrap.append(tableNode);
      return wrap;
    }
    function cell(value) { return el('td', safeText(value) || '—'); }
    function actionButton(label, kind, callback) {
      const button = el('button', label, kind);
      button.type = 'button';
      button.addEventListener('click', callback);
      return button;
    }
    function showFailure(error) {
      const notice = el('p', error instanceof Error ? error.message : 'Request failed', 'error');
      content.prepend(notice);
    }

    async function renderOverview() {
      page('Overview', 'Service health and current account totals.');
      try {
        const summary = await api('service.health');
        const grid = el('div', undefined, 'grid');
        [['Service', summary.status], ['Profiles', summary.profile_count], ['Open reports', summary.open_report_count]].forEach(([label, value]) => {
          const metric = el('section', undefined, 'metric');
          metric.append(el('span', String(label), 'muted'), el('strong', String(value)));
          grid.append(metric);
        });
        const panel = el('section', undefined, 'panel');
        panel.append(el('strong', 'Last checked'), el('p', safeText(summary.checked_at), 'muted'));
        content.append(grid, panel);
      } catch (error) { showFailure(error); }
    }

    async function renderUsers() {
      page('Users', 'Manage account access. Provider credentials are never included.');
      try {
        const result = await api('users.list', { page: 1, per_page: 100 });
        const rows = result.map((user) => {
          const row = document.createElement('tr');
          row.append(cell(user.email), cell(user.id), cell(user.created_at), cell(user.last_sign_in_at));
          const actions = el('td');
          const buttons = el('div', undefined, 'row-actions');
          const disabled = Boolean(user.banned_until);
          buttons.append(actionButton(disabled ? 'Enable' : 'Disable', disabled ? 'secondary' : 'danger', async () => {
            try { await api('users.set_access', { user_id: user.id, disabled: !disabled }); await renderUsers(); }
            catch (error) { showFailure(error); }
          }));
          buttons.append(actionButton('Delete…', 'danger', async () => {
            if (prompt(`Type the exact user ID to permanently delete this account:\n${user.id}`) !== user.id) return;
            try { await api('users.delete', { user_id: user.id, confirm_user_id: user.id }); await renderUsers(); }
            catch (error) { showFailure(error); }
          }));
          actions.append(buttons); row.append(actions); return row;
        });
        content.append(table(['Email', 'User ID', 'Created', 'Last sign in', 'Actions'], rows));
      } catch (error) { showFailure(error); }
    }

    async function renderDevices() {
      page('Devices', 'Review and revoke registered app installations.');
      try {
        const result = await api('devices.list');
        const rows = result.map((device) => {
          const row = document.createElement('tr');
          row.append(cell(device.device_name), cell(device.platform), cell(device.user_id), cell(device.last_seen_at));
          const action = el('td');
          if (!device.revoked_at) action.append(actionButton('Revoke', 'danger', async () => {
            try { await api('devices.revoke', { device_id: device.id }); await renderDevices(); }
            catch (error) { showFailure(error); }
          }));
          else action.append(el('span', 'Revoked', 'chip'));
          row.append(action); return row;
        });
        content.append(table(['Device', 'Platform', 'Owner ID', 'Last seen', 'Access'], rows));
      } catch (error) { showFailure(error); }
    }

    async function renderAnnouncements() {
      page('Announcements', 'Publish, schedule, and retire service messages.');
      const form = document.createElement('form');
      form.className = 'panel form-grid';
      form.append(el('h3', 'New announcement', 'wide'));
      const title = input('Title', 'title', 'text');
      const locale = input('Locale', 'locale', 'text'); locale.value = 'en';
      const body = input('Message', 'body', 'textarea');
      const severity = input('Severity', 'severity', 'select', ['info', 'warning', 'maintenance']);
      const published = input('Published', 'published', 'checkbox');
      const submit = el('button', 'Publish', 'primary'); submit.type = 'submit';
      form.append(title, locale, body, severity, published, submit);
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        try {
          await api('announcements.save', {
            title: title.value, locale: locale.value, body: body.value,
            severity: severity.value, published: published.checked, platforms: [],
          });
          await renderAnnouncements();
        } catch (error) { showFailure(error); }
      });
      content.append(form);
      try {
        const rows = (await api('announcements.list')).map((item) => {
          const row = document.createElement('tr');
          row.append(cell(item.title), cell(item.severity), cell(item.locale), cell(item.starts_at), cell(item.published ? 'Published' : 'Draft'));
          return row;
        });
        content.append(table(['Title', 'Severity', 'Locale', 'Starts', 'Status'], rows));
      } catch (error) { showFailure(error); }
    }

    async function renderReports() {
      page('Bug reports', 'Triage reports and update support status. Diagnostics are excluded from this view.');
      try {
        const rows = (await api('bug_reports.list')).map((report) => {
          const row = document.createElement('tr');
          row.append(cell(report.summary), cell(report.category), cell(report.platform), cell(report.status));
          const action = el('td');
          const select = document.createElement('select');
          ['new', 'triaged', 'resolved', 'closed'].forEach((value) => {
            const option = el('option', value); option.value = value; option.selected = value === report.status; select.append(option);
          });
          const save = actionButton('Save', 'secondary', async () => {
            try { await api('bug_reports.update', { report_id: report.id, status: select.value }); await renderReports(); }
            catch (error) { showFailure(error); }
          });
          action.append(select, save); row.append(action); return row;
        });
        content.append(table(['Summary', 'Category', 'Platform', 'State', 'Update'], rows));
      } catch (error) { showFailure(error); }
    }

    async function renderFeatures() {
      page('Feature configuration', 'Only non-secret flags and public configuration belong here.');
      const form = document.createElement('form'); form.className = 'panel form-grid';
      form.append(el('h3', 'Set feature', 'wide'));
      const key = input('Feature key', 'feature_key', 'text');
      const enabled = input('Enabled', 'enabled', 'checkbox');
      const config = input('Public JSON config', 'config', 'textarea'); config.value = '{}';
      const submit = el('button', 'Save feature', 'primary'); submit.type = 'submit';
      form.append(key, enabled, config, submit);
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        try { await api('features.set', { feature_key: key.value, enabled: enabled.checked, config: JSON.parse(config.value) }); await renderFeatures(); }
        catch (error) { showFailure(error); }
      });
      content.append(form);
      try {
        const rows = (await api('features.list')).map((feature) => {
          const row = document.createElement('tr');
          row.append(cell(feature.feature_key), cell(feature.enabled ? 'Enabled' : 'Disabled'), cell(JSON.stringify(feature.config)));
          return row;
        });
        content.append(table(['Feature', 'State', 'Config'], rows));
      } catch (error) { showFailure(error); }
    }

    async function renderVersion() {
      page('Version', 'Set the latest and minimum supported app version.');
      try {
        const version = await api('version.get');
        const form = document.createElement('form'); form.className = 'panel form-grid';
        const latest = input('Latest version', 'latest_version', 'text'); latest.value = version.latest_version;
        const minimum = input('Minimum supported', 'minimum_supported_version', 'text'); minimum.value = version.minimum_supported_version;
        const updateUrl = input('Update URL', 'update_url', 'url'); updateUrl.value = version.update_url || '';
        const force = input('Force update', 'force_update', 'checkbox'); force.checked = version.force_update;
        const submit = el('button', 'Save version', 'primary'); submit.type = 'submit';
        form.append(latest, minimum, updateUrl, force, submit);
        form.addEventListener('submit', async (event) => {
          event.preventDefault();
          try { await api('version.set', { latest_version: latest.value, minimum_supported_version: minimum.value, update_url: updateUrl.value || null, force_update: force.checked }); await renderVersion(); }
          catch (error) { showFailure(error); }
        });
        content.append(form);
      } catch (error) { showFailure(error); }
    }

    function input(labelText, name, type, choices = []) {
      const wrapper = el('label', labelText, name === 'body' || name === 'config' ? 'wide' : '');
      let control;
      if (type === 'textarea') control = document.createElement('textarea');
      else if (type === 'select') {
        control = document.createElement('select');
        choices.forEach((choice) => { const option = el('option', choice); option.value = choice; control.append(option); });
      } else {
        control = document.createElement('input'); control.type = type;
      }
      control.name = name;
      if (type !== 'checkbox') control.required = !['update_url'].includes(name);
      wrapper.append(control);
      return wrapper;
    }

    const views = { overview: renderOverview, users: renderUsers, devices: renderDevices, announcements: renderAnnouncements, reports: renderReports, features: renderFeatures, version: renderVersion };
    document.querySelectorAll('.nav-button[data-view]').forEach((button) => {
      button.addEventListener('click', () => {
        document.querySelectorAll('.nav-button[data-view]').forEach((item) => item.classList.toggle('active', item === button));
        state.view = button.dataset.view;
        void views[state.view]();
      });
    });

    $('#login-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      setError($('#login-error'), '');
      const submit = $('#login-submit'); submit.disabled = true;
      try {
        state.url = $('#project-url').value.trim().replace(/\/$/, '');
        state.key = $('#public-key').value.trim();
        state.email = $('#email').value.trim();
        const response = await fetch(`${state.url}/auth/v1/token?grant_type=password`, {
          method: 'POST',
          headers: { apikey: state.key, 'content-type': 'application/json' },
          body: JSON.stringify({ email: state.email, password: $('#password').value }),
        });
        const session = await response.json().catch(() => ({}));
        if (!response.ok || !session.access_token) throw new Error('Sign-in failed. Check credentials and project settings.');
        const claims = JSON.parse(atob(session.access_token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
        if (claims.app_metadata?.role !== 'admin') throw new Error('This account does not have the admin role.');
        state.token = session.access_token;
        $('#password').value = '';
        $('#admin-email').textContent = state.email;
        loginView.classList.add('hidden'); appView.classList.remove('hidden');
        await renderOverview();
      } catch (error) {
        setError($('#login-error'), error instanceof Error ? error.message : 'Sign-in failed.');
      } finally { submit.disabled = false; }
    });

    $('#sign-out').addEventListener('click', async () => {
      if (state.token) {
        try { await fetch(`${state.url}/auth/v1/logout`, { method: 'POST', headers: { apikey: state.key, authorization: `Bearer ${state.token}` } }); } catch { /* local memory is cleared regardless */ }
      }
      state.token = ''; state.key = ''; state.url = ''; state.email = '';
      appView.classList.add('hidden'); loginView.classList.remove('hidden');
    });
  </script>
</body>
</html>
