name: saiful_iptv_player
description: Saiful IPTV Player application foundation.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.9'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 3.5.0
  go_router: 18.1.4
  dio: 5.11.1
  crypto: 3.0.8
  logging: 1.3.0
  supabase_flutter: 2.18.3
  flutter_secure_storage: 11.2.0
  shared_preferences: 2.5.5
  freezed_annotation: 3.1.0
  json_annotation: 4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0
  build_runner: 2.16.2
  freezed: 4.0.3
  json_serializable: 6.15.2

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
